# The SHACL gate in continuous integration (Session 4): on every push and pull
# request, map both sources and validate each whole graph against its own
# shapes (D9, D14). Any Violation, or a shape that checks nothing, fails the
# run (red), and a red pull request is not merged. The same steps as the
# stack's pipeline, without loading an endpoint. Then check the mapping
# against the paper we wrote by hand (Session 2): any difference also fails
# the run. The SHACL report (both graphs) is kept with every run, green or
# red, under "Artifacts" on the run's page.

name: SHACL gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pipeline
        run: |
          pip install -r pipeline/requirements-pipeline.txt
          pip install --no-deps morph-kgc==2.10.0
      - name: Map and validate (fails on any Violation)
        run: python pipeline/run.py --no-load
      - name: Keep the SHACL report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shacl-report
          path: build/shacl-report.txt
          if-no-files-found: ignore
      - name: Check the mapping against the paper written by hand
        run: python mapping/check_one_paper.py
