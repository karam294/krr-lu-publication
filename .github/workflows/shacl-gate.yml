# The SHACL gate in continuous integration (Session 4): on every push and pull
# request, map the source and validate it. Any Violation fails the run (red),
# and a red pull request is not merged. The same steps as the stack's pipeline,
# without loading an endpoint. Then check the mapping against the paper we wrote
# by hand (Session 2): any difference also fails the run.

name: SHACL gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pipeline
        run: |
          pip install -r pipeline/requirements-pipeline.txt
          pip install --no-deps morph-kgc==2.10.0
      - name: Map and validate (fails on any Violation)
        run: python pipeline/run.py --no-load
      - name: Check the mapping against the paper written by hand
        run: python mapping/check_one_paper.py
