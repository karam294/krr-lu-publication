# The whole system, one command:   docker compose up --build
#
#   fuseki        the SPARQL endpoint (Session 2), dataset "kr"
#   reasoner      on demand only: ELK and HermiT on the ontology (Session 3)
#   pipeline      runs once: map the source (Session 5), SHACL gate (Session 4),
#                 VoID, load the endpoint; stops the stack if the data fails
#   access-layer  questions in English (Session 7), on http://127.0.0.1:8000
#   postgres, ontop  on demand only: the virtualized route, compared with the
#                 deployed one (Session 5, D16); see mapping/README.md
#
# Every port listens on this computer only (127.0.0.1). Secrets (the Gemini
# key, a database password) live in .env, which is never committed.
# YOUR TEAM: if your source is a database container, add it here and set
# DB_URL in .env (for example postgresql+psycopg2://user:password@db:5432/name).

services:
  fuseki:
    build: ./fuseki
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      - fuseki-data:/data

  # Session 3: the reasoners ELK and HermiT, through ROBOT. Not part of the
  # stack: `docker compose up` never starts it. Run it by hand:
  #   docker compose --profile tools run --rm reasoner
  reasoner:
    build: ./reasoner
    profiles: ["tools"]
    volumes:
      - ./:/work

  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    environment:
      FUSEKI_URL: http://fuseki:3030
    env_file:
      - path: .env
        required: false
    volumes:
      - ./:/work
    depends_on:
      - fuseki
    restart: "no"

  access-layer:
    build:
      context: .
      dockerfile: access-layer/Dockerfile
    environment:
      SPARQL_ENDPOINT: http://fuseki:3030/kr/sparql
      VOID_FILE: /work/build/void.ttl
    env_file:
      - path: .env
        required: true
    volumes:
      - ./build:/work/build:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      pipeline:
        condition: service_completed_successfully
    restart: unless-stopped

  # Session 5: the virtualized route (D16). Not part of the stack: `docker
  # compose up` starts neither. The same tables in PostgreSQL, and Ontop
  # answering SPARQL from them through our mappings (mapping/README.md):
  #   docker compose --profile virtual up -d postgres
  #   python mapping/ontop/prepare_ontop.py
  #   docker compose --profile virtual up -d --build ontop
  # The password is POSTGRES_PASSWORD in .env (never committed).
  postgres:
    image: postgres:16-alpine
    profiles: ["virtual"]
    environment:
      POSTGRES_USER: kr
      POSTGRES_DB: lu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      # Sort text by its bytes, as SPARQL sorts strings (by code point), so a
      # query's ORDER BY gives the same order on Ontop as on Fuseki.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  ontop:
    build: ./mapping/ontop
    profiles: ["virtual"]
    volumes:
      - ./:/work
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - postgres

volumes:
  fuseki-data:
  postgres-data:
