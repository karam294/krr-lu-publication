# The test set: 14 questions the graph can answer and 4 it cannot. The same
# layout as the TEXT2SPARQL questions files (dataset, questions, question.en),
# so text2sparql-client can read it too; "gold" (the right query) and "refuse"
# are the course's own fields, which it ignores. None of these is an example
# of examples.ttl. Every gold query is asked of graph/openalex and the ontology
# only, as the layer asks (D19).

dataset:
  id: https://ul.edu.lb/kr/lu/
  prefix: "PREFIX pub: <https://ul.edu.lb/kr/pub#>\nPREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>"

questions:
  - id: 1
    question: {en: "How many papers did LU publish in 2023?"}
    gold: |
      SELECT (COUNT(?p) AS ?n) WHERE { ?p pub:publicationYear 2023 }
  - id: 2
    question: {en: "How many LU papers are open access?"}
    gold: |
      SELECT (COUNT(?p) AS ?n) WHERE { ?p pub:isOpenAccess true }
  - id: 3
    question: {en: "How many conference papers are there?"}
    gold: |
      SELECT (COUNT(?p) AS ?n) WHERE { ?p a pub:ConferencePaper }
  - id: 4
    question: {en: "In which languages are LU papers written?"}
    gold: |
      SELECT DISTINCT ?language WHERE { ?p pub:language ?language }
  - id: 5
    question: {en: "Which LU papers have been retracted?"}
    gold: |
      SELECT ?p WHERE { ?p pub:isRetracted true }
  - id: 6
    question: {en: "How many papers did LU publish each year?"}
    gold: |
      SELECT ?year (COUNT(?p) AS ?n) WHERE { ?p pub:publicationYear ?year } GROUP BY ?year
  - id: 7
    question: {en: "What are the names of the 5 venues with the most LU papers?"}
    gold: |
      SELECT ?name WHERE { ?p pub:publishedIn ?v . ?v pub:name ?name }
      GROUP BY ?name ORDER BY DESC(COUNT(?p)) ?name LIMIT 5
  - id: 8
    question: {en: "How many papers are in the field Medicine?"}
    gold: |
      SELECT (COUNT(DISTINCT ?p) AS ?n) WHERE { ?p pub:hasTopic ?t . ?t pub:field "Medicine" }
  - id: 9
    question: {en: "How many papers did Maha Hoteit write?"}
    gold: |
      SELECT (COUNT(DISTINCT ?p) AS ?n) WHERE {
        ?p pub:hasAuthorship ?a . ?a pub:author ?x . ?x pub:name ?name FILTER(LCASE(?name) = "maha hoteit") }
  - id: 10
    question: {en: "How many different institutions from France appear on LU papers?"}
    gold: |
      SELECT (COUNT(DISTINCT ?i) AS ?n) WHERE { ?a pub:affiliation ?i . ?i pub:countryCode "FR" }
  - id: 11
    question: {en: "Which research domain has the most LU papers?"}
    gold: |
      SELECT ?domain WHERE { ?p pub:hasTopic ?t . ?t pub:domain ?domain }
      GROUP BY ?domain ORDER BY DESC(COUNT(?p)) ?domain LIMIT 1
  - id: 12
    question: {en: "How many authors have an ORCID?"}
    gold: |
      SELECT (COUNT(DISTINCT ?x) AS ?n) WHERE { ?x pub:orcid ?orcid }
  - id: 13
    question: {en: "What is the title of the paper with DOI 10.1007/s00205-021-01737-1?"}
    gold: |
      SELECT ?title WHERE { ?p pub:doi "10.1007/s00205-021-01737-1" ; pub:title ?title }
  - id: 14
    question: {en: "On how many papers is an LU author the first author?"}
    gold: |
      SELECT (COUNT(DISTINCT ?p) AS ?n) WHERE {
        ?p pub:hasAuthorship ?a .
        ?a pub:authorPosition "first" ; pub:affiliation <https://ul.edu.lb/kr/id/institution/openalex/I160368002> }
  - id: 15
    question: {en: "What is the h-index of Pascale Salameh?"}
    refuse: "the graph has no citation counts"
  - id: 16
    question: {en: "Which LU papers were funded by the European Union?"}
    refuse: "the graph has no funding"
  - id: 17
    question: {en: "What is the email address of Maha Hoteit?"}
    refuse: "the graph has no contact details"
  - id: 18
    question: {en: "How many students study at Lebanese University?"}
    refuse: "the graph has no students"
